<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Flight Status Dashboard</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #161d2e;
    --panel-2: #1d2740;
    --border: #2a3454;
    --text: #e7ecf7;
    --text-dim: #8b97b5;
    --accent: #4f8cff;
    --green: #35d07f;
    --yellow: #f5b942;
    --orange: #ff8a4c;
    --red: #ff5c68;
    --gray: #6b7690;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, #0b0f19, #10162a);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 20px 80px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 22px; margin: 0; }
  h1 span { color: var(--text-dim); font-weight: 400; font-size: 14px; display: block; margin-top: 4px; }
  .conn { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gray); }
  .dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.down { background: var(--red); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .panel h2 { margin: 0 0 14px; font-size: 15px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

  form { display: grid; grid-template-columns: repeat(5, 1fr) auto; gap: 10px; align-items: end; }
  form label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
  input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 13px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    position: relative;
    transition: box-shadow .3s;
  }
  .card.flash { box-shadow: 0 0 0 2px var(--accent); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .fno { font-size: 16px; font-weight: 700; }
  .route { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .badge { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 20px; text-transform: uppercase; letter-spacing: .03em; }
  .badge.ON_TIME { background: rgba(53,208,127,.15); color: var(--green); }
  .badge.BOARDING { background: rgba(79,140,255,.15); color: var(--accent); }
  .badge.DELAYED { background: rgba(255,138,76,.15); color: var(--orange); }
  .badge.DEPARTED { background: rgba(245,185,66,.15); color: var(--yellow); }
  .badge.LANDED { background: rgba(139,151,181,.15); color: var(--text-dim); }
  .badge.CANCELLED { background: rgba(255,92,104,.15); color: var(--red); }

  .meta { margin-top: 12px; font-size: 12px; color: var(--text-dim); line-height: 1.6; }
  .meta b { color: var(--text); font-weight: 600; }
  .reason { margin-top: 8px; font-size: 12px; background: rgba(255,138,76,.08); border-left: 2px solid var(--orange); padding: 6px 8px; border-radius: 4px; color: #ffb98a; }
  .remove { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--text-dim); font-size: 16px; padding: 0 4px; cursor: pointer; }
  .remove:hover { color: var(--red); }

  .empty { text-align: center; color: var(--text-dim); padding: 30px 0; font-size: 13px; }

  #toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 50; max-width: 320px; }
  .toast {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 8px 20px rgba(0,0,0,.35);
    animation: slidein .25s ease-out;
  }
  @keyframes slidein { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .toast .t-title { font-weight: 700; margin-bottom: 2px; }

  .apibar { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  .apibar input { max-width: 260px; }
  .apibar span { font-size: 12px; color: var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Live Flight Status
      <span>Dashboard for the flight-tracker Spring Boot backend</span>
    </h1>
    <div class="conn"><span class="dot" id="connDot"></span><span id="connLabel">Connecting…</span></div>
  </header>

  <div class="apibar">
    <span>API base:</span>
    <input id="apiBase" value="" />
    <button class="ghost" id="reconnectBtn" type="button">Reconnect</button>
  </div>

  <div class="panel">
    <h2>Track a new flight</h2>
    <form id="trackForm">
      <div>
        <label>Flight #</label>
        <input id="fFlightNumber" placeholder="AI202" required>
      </div>
      <div>
        <label>Origin</label>
        <input id="fOrigin" placeholder="DEL" required>
      </div>
      <div>
        <label>Destination</label>
        <input id="fDestination" placeholder="BOM" required>
      </div>
      <div>
        <label>Departure</label>
        <input id="fDeparture" type="datetime-local" required>
      </div>
      <div>
        <label>Arrival</label>
        <input id="fArrival" type="datetime-local" required>
      </div>
      <button type="submit">Track</button>
    </form>
  </div>

  <div class="panel">
    <h2>Tracked flights</h2>
    <div class="grid" id="flightGrid">
      <div class="empty">No flights tracked yet — add one above.</div>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
// Empty API base = same origin the dashboard was loaded from (works out of the box
// when served by the Spring Boot app itself at http://localhost:8080).
document.getElementById('apiBase').value = document.getElementById('apiBase').value || window.location.origin;
let API = document.getElementById('apiBase').value.replace(/\/$/, '');
let evtSource = null;
let flights = {};

const grid = document.getElementById('flightGrid');
const connDot = document.getElementById('connDot');
const connLabel = document.getElementById('connLabel');

function fmt(dt) {
  if (!dt) return '—';
  try { return new Date(dt).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  catch { return dt; }
}

function renderGrid() {
  const list = Object.values(flights);
  if (list.length === 0) {
    grid.innerHTML = '<div class="empty">No flights tracked yet — add one above.</div>';
    return;
  }
  grid.innerHTML = list.map(f => `
    <div class="card" id="card-${f.flightNumber}">
      <button class="remove" title="Stop tracking" onclick="untrack('${f.flightNumber}')">×</button>
      <div class="card-top">
        <div>
          <div class="fno">${f.flightNumber}</div>
          <div class="route">${f.origin} → ${f.destination}</div>
        </div>
        <div class="badge ${f.status}">${f.status.replace('_',' ')}</div>
      </div>
      <div class="meta">
        <div>Scheduled departure: <b>${fmt(f.scheduledDeparture)}</b></div>
        <div>Scheduled arrival: <b>${fmt(f.scheduledArrival)}</b></div>
        <div>Estimated arrival: <b>${fmt(f.estimatedArrival)}</b></div>
        <div>Last updated: <b>${fmt(f.lastUpdated)}</b></div>
      </div>
      ${f.delayReason ? `<div class="reason">Delay reason: ${f.delayReason}</div>` : ''}
    </div>
  `).join('');
}

async function refreshFlights() {
  try {
    const res = await fetch(`${API}/api/flights`);
    const data = await res.json();
    flights = {};
    data.forEach(f => flights[f.flightNumber] = f);
    renderGrid();
  } catch (e) {
    console.error('Failed to fetch flights', e);
  }
}

async function trackFlight(payload) {
  const res = await fetch(`${API}/api/flights/track`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error('Track request failed: ' + res.status);
  await refreshFlights();
}

async function untrack(flightNumber) {
  try {
    await fetch(`${API}/api/flights/track/${flightNumber}`, { method: 'DELETE' });
    delete flights[flightNumber];
    renderGrid();
  } catch (e) {
    console.error('Failed to untrack', e);
  }
}

function showToast(update) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div class="t-title">${update.flightNumber} — ${update.status.replace('_',' ')}</div>${update.message}`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 6000);

  const card = document.getElementById(`card-${update.flightNumber}`);
  if (card) {
    card.classList.add('flash');
    setTimeout(() => card.classList.remove('flash'), 1200);
  }
}

function connect() {
  if (evtSource) evtSource.close();
  connLabel.textContent = 'Connecting…';
  connDot.className = 'dot';

  evtSource = new EventSource(`${API}/api/flights/stream`);

  evtSource.onopen = () => {
    connLabel.textContent = 'Live';
    connDot.className = 'dot live';
  };

  evtSource.addEventListener('flight-status-update', (e) => {
    const update = JSON.parse(e.data);
    if (flights[update.flightNumber]) {
      flights[update.flightNumber].status = update.status;
      flights[update.flightNumber].delayReason = update.delayReason;
      flights[update.flightNumber].estimatedArrival = update.revisedEstimatedArrival;
      flights[update.flightNumber].lastUpdated = update.timestamp;
    }
    renderGrid();
    showToast(update);
  });

  evtSource.onerror = () => {
    connLabel.textContent = 'Disconnected — retrying…';
    connDot.className = 'dot down';
  };
}

document.getElementById('trackForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    flightNumber: document.getElementById('fFlightNumber').value.trim(),
    origin: document.getElementById('fOrigin').value.trim().toUpperCase(),
    destination: document.getElementById('fDestination').value.trim().toUpperCase(),
    scheduledDeparture: document.getElementById('fDeparture').value,
    scheduledArrival: document.getElementById('fArrival').value
  };
  try {
    await trackFlight(payload);
    e.target.reset();
  } catch (err) {
    alert('Could not track flight — check the API base URL and that the backend is running.\n' + err.message);
  }
});

document.getElementById('reconnectBtn').addEventListener('click', () => {
  API = document.getElementById('apiBase').value.replace(/\/$/, '');
  refreshFlights();
  connect();
});

refreshFlights();
connect();
setInterval(refreshFlights, 10000); // safety-net poll in case an SSE event is missed
</script>
</body>
</html>
