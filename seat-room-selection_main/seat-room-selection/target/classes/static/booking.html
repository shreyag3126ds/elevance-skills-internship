<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seat & Room Selection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <a class="back" href="/">&larr; Dashboard</a>
    <h1>Seat &amp; Room Selection</h1>
    <label>User ID <input id="userId" value="demo-user"></label>
    <span id="live" title="Availability refreshes every 3 seconds">● live</span>
</header>

<nav>
    <button class="tab active" data-tab="flight">Flight seats</button>
    <button class="tab" data-tab="hotel">Hotel rooms</button>
</nav>

<div id="toast" hidden></div>

<main>
    <!-- FLIGHT -->
    <section id="flight" class="panel">
        <div class="layout">
            <div>
                <div class="legend">
                    <span><i class="sw standard"></i>Standard</span>
                    <span><i class="sw extra"></i>Extra legroom</span>
                    <span><i class="sw premium"></i>Premium</span>
                    <span><i class="sw booked"></i>Taken</span>
                    <span><i class="sw selected"></i>Selected</span>
                </div>
                <div id="seatMap" class="seat-map"></div>
            </div>
            <aside class="summary">
                <h2>Your seat</h2>
                <div id="seatSummary">Select a seat on the map.</div>
                <button id="bookSeat" disabled>Book seat</button>
                <button id="releaseSeat" class="secondary" disabled>Release my seat</button>
                <button id="savePrefSeat" class="secondary" disabled>Save as my preference</button>
                <p id="seatPrefText" class="muted"></p>
            </aside>
        </div>
    </section>

    <!-- HOTEL -->
    <section id="hotel" class="panel" hidden>
        <div class="layout">
            <div>
                <div class="filter">
                    Room type:
                    <select id="roomFilter">
                        <option value="">All</option>
                        <option>STANDARD</option>
                        <option>DELUXE</option>
                        <option>SUITE</option>
                    </select>
                </div>
                <div id="roomGrid" class="room-grid"></div>
            </div>
            <aside class="summary">
                <h2>Your room</h2>
                <div id="roomSummary">Select a room.</div>
                <button id="bookRoom" disabled>Book room</button>
                <button id="releaseRoom" class="secondary" disabled>Release my room</button>
                <button id="savePrefRoom" class="secondary" disabled>Save as my preference</button>
                <p id="roomPrefText" class="muted"></p>
            </aside>
        </div>
    </section>
</main>

<!-- Room gallery / preview modal -->
<div id="modal" hidden>
    <div class="modal-box">
        <button id="closeModal" class="close">×</button>
        <img id="modalImg" alt="Room preview">
        <div class="modal-controls">
            <button id="prevImg">‹</button>
            <span id="modalCaption"></span>
            <button id="nextImg">›</button>
        </div>
        <a id="tourLink" target="_blank" rel="noopener" hidden>Open 3D tour</a>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
